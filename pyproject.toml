[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raceplan"
version = "0.1.0"
description = "Reproducible comparison of global planners for car-like robots"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "Pillow>=11.0",
  "PyYAML>=6.0",
]

[project.scripts]
raceplan-compare = "raceplan.compare:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src"]

