.jp{font:inherit;cursor:pointer;border-radius:2em;padding:.35em 1em;white-space:nowrap;border:1px solid rgba(0,122,255,.3);background:rgba(0,122,255,.1);color:var(--acc)}.jp.ok{border-color:rgba(52,199,89,.35);background:rgba(52,199,89,.12);color:var(--teal)}.jp.bad{border-color:rgba(255,59,48,.35);background:rgba(255,59,48,.1);color:var(--red)}.jp[hidden]{display:none}.jp:focus-visible{outline:.18em solid rgba(0,122,255,.45)}
.dlgbg{position:absolute;inset:0;z-index:70;background:rgba(28,28,30,.18);display:grid;place-items:center}.dlgbg[hidden]{display:none}
.dlg{width:min(46em,90%);max-height:90%;overflow:auto;background:rgba(255,255,255,.98);border-radius:1.2em;box-shadow:0 1.5em 4em rgba(40,52,90,.3);padding:1em 1.2em;display:flex;flex-direction:column;gap:.6em}
.dlg h3{margin:0;font-size:1.15em;display:flex;align-items:center;gap:.6em}.dlg code{font-family:"SF Mono",Consolas,monospace;font-size:.92em}
.dlg .f{display:flex;flex-direction:column;gap:.25em;font-size:.92em;color:var(--mut);min-width:0}.dlg .row{display:flex;gap:.9em;flex-wrap:wrap;align-items:flex-start}.dlg .row>.f{flex:1}
.dlg select,.dlg input[type=text],.dlg textarea{font:inherit;color:var(--ink);border:1px solid rgba(60,60,67,.22);border-radius:.6em;padding:.3em .55em;background:#fff}
.dlg textarea{font-family:"SF Mono",Consolas,monospace;font-size:.9em;resize:vertical}.dlg .ck{display:inline-flex;align-items:center;gap:.45em;color:var(--ink);font-size:.95em;margin-right:.6em}
.dlg .warnbox{background:rgba(255,59,48,.07);border:1px solid rgba(255,59,48,.3);color:#b4231a;border-radius:.8em;padding:.5em .7em;font-size:.9em;line-height:1.5;display:flex;flex-direction:column;gap:.35em}.dlg .warnbox[hidden]{display:none}
.dlg .err{color:var(--red);font-size:.9em;white-space:pre-wrap}.dlg .err:empty{display:none}.dlg .meta{color:var(--mut);font-size:.9em;word-break:break-all}
.dlg .btns{display:flex;gap:.6em;align-items:center}.dlg .btns .sp{flex:1;font-size:.82em;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{font:inherit;border:0;border-radius:2em;padding:.35em 1.1em;cursor:pointer;font-weight:600;background:rgba(118,118,128,.14);color:var(--ink);white-space:nowrap}.btn.pri{background:var(--acc);color:#fff}.btn:disabled{opacity:.45;cursor:default}.btn:focus-visible{outline:.18em solid rgba(0,122,255,.45);outline-offset:.1em}
.joblog{font-family:"SF Mono",Consolas,monospace;font-size:.8em;background:#1c1c1e;color:#e5e5ea;border-radius:.7em;padding:.6em .8em;height:13em;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0;flex:none}
.phases{display:flex;gap:.5em;flex-wrap:wrap}.ph{font-size:.85em;border-radius:2em;padding:.1em .75em;background:rgba(118,118,128,.12);color:var(--mut)}.ph.running{background:rgba(0,122,255,.14);color:var(--acc)}.ph.complete{background:rgba(52,199,89,.16);color:var(--teal)}.ph.failed{background:rgba(255,59,48,.13);color:var(--red)}
.fresh{display:inline-block;margin-left:.45em;font-size:.72em;font-weight:700;color:#fff;background:var(--acc);border-radius:1em;padding:0 .5em;vertical-align:.1em}
.watchbar{display:flex;align-items:center;gap:.6em;background:rgba(0,122,255,.08);border:1px solid rgba(0,122,255,.25);border-radius:.8em;padding:.4em .7em;font-size:.9em}.watchbar span{flex:1;min-width:0;color:var(--mut);word-break:break-all}.watchbar.off{background:rgba(118,118,128,.08);border-color:rgba(118,118,128,.25)}
</style></head><body>
<div class="wrap"><div class="app" id="app">
 <div class="top">
  <div class="brand"><div class="flag"></div>RacePlan</div>
  <div class="crumb"><span>실행</span><b id="runName">—</b><span>›</span><select class="pill" id="caseSel" title="지도 / case"></select><select class="pill" id="seedSel" title="seed"></select></div>
  <div class="tabs" id="tabs"><button data-v="explore" class="on">탐색</button><button data-v="cmp">비교</button></div>
  <div class="sp"></div>
  <button class="jp" id="jobPill" hidden></button>
  <button class="lw" id="lw" hidden></button>
  <div class="cov" id="cov"></div>
 </div>
 <div class="msg" id="msg"></div>
 <div class="lwd" id="lwd" hidden title="눌러서 닫기"></div>
 <div class="dlgbg" id="dlgbg" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"></div></div>
 <div class="rail">
  <div class="card runs"><h3>저장된 실행 <em id="runCount"></em><button class="csvb" id="newRun" hidden>+ 새 실행</button></h3><div class="cb"><div class="list" id="runs"></div></div></div>
  <div class="card grid"><h3>Starting grid <em>선택 → Inspector</em></h3><div class="cb"><div class="list" id="grid"></div></div></div>
 </div>
 <div class="work">
  <div class="card lbc"><h3>리더보드 <em id="lbNote"></em></h3><div class="cb"><div class="lbwrap" id="lb"></div>
   <div class="leg"><span style="color:var(--teal)">■</span> 도달 <span style="color:var(--red)">■</span> 충돌 <span style="color:var(--amb)">■</span> 시간 초과 <span style="color:var(--vio)">■</span> 계획 실패 · 성공과 합치지 않습니다</div></div></div>
  <div class="card tbc"><h3>에피소드 <em><select class="fl" id="filter"><option value="all">전체 보기</option><option value="fail">실패만</option><option value="ok">도달만</option></select><button class="csvb" id="epCsv" disabled>CSV ↓</button></em></h3><div class="cb"><div class="tnote" id="tnote"></div><div class="tw" id="table"></div></div></div>
  <div class="card trc"><h3>트랙 · 체크한 planner 동시 주행 <em id="trk"></em></h3><div class="cb"><svg id="track"><g id="trStatic"></g><g id="trDyn"></g></svg><div class="leg">점선 = 계획 경로 · 실선 = 실제 궤적 · 저장된 결과만 표시합니다</div></div></div>
 </div>
 <div class="cmpv"><div class="card"><h3>비교 분석 <em id="cmpNote"></em></h3><div class="cb"><div class="cmpctl" id="cmpCtl"></div><div class="cmpbody" id="cmpBody"></div><div class="cmpsum" id="cmpSum"></div></div></div></div>
 <div class="insp"><div class="card"><h3>Inspector</h3><div class="cb" id="insp"></div></div></div>
 <div class="card time"><h3>텔레메트리 타임라인 <em style="margin-left:.8em">같은 시각 기준 · 끌어서 이동</em><button class="play" id="play">▶ 재생</button></h3>
  <div class="cb"><div class="lanes-w"><div class="lanes" id="lanes"></div><div class="scrubz"><div class="scrub" id="scrub" data-t="0.0 s"></div><input class="scr" id="scr" type="range" min="0" max="1" step="0.01" value="0" aria-label="시각"></div></div><div class="axis" id="axis"></div></div></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#007aff','#00a08a','#e8830c','#a94fd8','#e0457b','#5b6ee1','#7a8a00','#8e6b4e'];
const S={runs:[],run:null,case:null,detail:null,seed:null,sel:null,on:{},t:0,tMax:1,playing:false,sort:{key:'planner',dir:1},filter:'all',token:0};

function group(cls){if(cls==='reached')return 'ok';if(cls==='timeout')return 'to';if(cls.endsWith('collision'))return 'col';return 'pe'}
const OUT={ok:['t-ok','✓','var(--teal)'],col:['t-col','✕','var(--red)'],to:['t-to','⏱','var(--amb)'],pe:['t-pe','!','var(--vio)']};
function outLabel(cls){return {reached:'도달',driving_collision:'충돌',initial_collision:'시작 충돌',timeout:'시간 초과',planning_error:'계획 오류'}[cls]||'계획 실패'}
const fmt=(v,d=3)=>v===null||v===undefined?'—':(+v).toFixed(d);
function median(a){const s=a.filter(v=>v!==null&&v!==undefined).sort((x,y)=>x-y);if(!s.length)return null;const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
const planners=()=>S.case?S.case.planners:[];
const pIndex=p=>planners().indexOf(p);
const color=p=>COLORS[pIndex(p)%COLORS.length];
const badge=p=>String(pIndex(p)+1).padStart(2,'0');
const eps=()=>S.case?S.case.episodes:[];
const ep=(p,s)=>eps().find(e=>e.planner===p&&e.simulation_seed===s);
/* 표본 유효성(valid)은 서버 analysis.trace_valid 한 곳에서 정한다. 무효 궤적은 재생·시계열에 쓰지 않는다 */
const rawTrace=e=>e&&S.detail?S.detail.traces[e.episode_id]:null;
const trace=e=>{const tr=rawTrace(e);return tr&&tr.valid?tr:null};
const badTrace=e=>{const tr=rawTrace(e);return !!tr&&tr.t.length>0&&!tr.valid};
function showMsg(t){$('msg').textContent=t||'';$('msg').classList.toggle('on',!!t)}
async function api(path){const r=await fetch(path);const b=await r.json().catch(()=>({error:'응답을 읽지 못했습니다'}));if(!r.ok)throw new Error(b.error||('HTTP '+r.status));return b}

/* 저장된 실행 목록 */
function renderRuns(){$('runCount').textContent=S.runs.length+'개';
 if(!S.runs.length){$('runs').innerHTML='<div class="empty">저장된 실행이 없습니다</div>';return}
 $('runs').innerHTML=S.runs.map(r=>{const c={ok:0,col:0,to:0,pe:0};Object.entries(r.outcomes).forEach(([k,v])=>{if(k)c[group(k)]+=v});const n=r.episodes||1;
  const bar=r.episodes?`<div class="mini">${[['ok','teal'],['col','red'],['to','amb'],['pe','vio']].map(([k,v])=>`<i style="width:${c[k]/n*100}%;background:var(--${v})"></i>`).join('')}</div>`:'';
  const note=r.status==='complete'?`${r.episodes} ep · 도달 ${c.ok}`:esc(r.status);
  return `<div class="setrow ${S.run&&S.run.id===r.id?'on':''}" data-id="${esc(r.id)}" title="${esc(r.id)}"><b>${esc(r.name)}${S.fresh.has(r.id)?'<span class="fresh" title="이 화면을 연 뒤 새로 생긴 결과">새</span>':''}</b>${r.id.includes('/')?`<small>${esc(r.id.slice(0,r.id.lastIndexOf('/')))}</small>`:''}<small>${r.kind==='suite'?'suite':'batch'} · ${note}</small>${bar}</div>`}).join('')}
$('runs').onclick=e=>{const r=e.target.closest('.setrow');if(r)openRun(r.dataset.id)};

/* want = {q, warn}: URL 복원 중에만 넘긴다. 사용자 조작 경로는 want 없이 호출되어 복원 상태를 끝내고, 대기 중인 시각을 지금 항목에 먼저 확정한다.
   S.loading 동안에는 주소를 쓰지 않아 "새 run + 이전 case" 같은 중간 상태가 history에 남지 않는다 */
function beginLoad(token,want){stop();if(!want){S.restoring=0;S.pendingT=null;if(tTimer)writeUrl()}S.loading=token;S.cmp=null;S.ctoken++;closePicker(false);
 $('epCsv').disabled=true;if($('covCsv'))$('covCsv').disabled=true}  // 전환 중에는 이전 run·case를 내려받지 않는다
async function openRun(id,want=null){const token=++S.token;beginLoad(token,want);showMsg('');if(S.fresh.delete(id))renderRuns();
 try{const run=want&&S.run&&S.run.id===id&&S.run.cases.length?S.run:await api('/api/run?id='+encodeURIComponent(id));if(token!==S.token)return;S.run=run;$('runName').textContent=run.name;renderRuns();renderCoverage();
  let cid=run.cases[0]?.id;
  if(want&&want.q.has('case')){const asked=want.q.getAll('case')[0],cov=run.coverage.find(c=>c.case_id===asked);
   cid=one(want.q,want.warn,'case',v=>run.cases.some(c=>c.id===v),'링크의 case',`다른 지도로 대신하지 않습니다${cov?` (상태 ${cov.status}${cov.error?' — '+cov.error:''})`:''}. 지도를 선택하세요`)}
  const ok=cid!==undefined&&run.cases.some(c=>c.id===cid);
  $('caseSel').innerHTML=(ok||!run.cases.length?'':'<option value="" selected disabled>지도 선택</option>')+run.cases.map(c=>`<option value="${esc(c.id)}">지도: ${esc(c.map)}${c.id==='batch'?'':' ('+esc(c.id)+')'}</option>`).join('');
  if(ok){await openCase(cid,token,want);return}
  S.loading=0;S.case=null;S.detail=null;$('seedSel').innerHTML='';renderAll()
 }catch(err){if(token!==S.token)return;S.loading=0;S.run={id,cases:[],coverage:[]};S.case=null;S.detail=null;$('runName').textContent=id;$('caseSel').innerHTML='';$('seedSel').innerHTML='';renderRuns();renderCoverage();renderAll();showMsg('이 실행을 열 수 없습니다.\n'+err.message)}}
async function openCase(id,token=null,want=null){if(token===null){token=++S.token;beginLoad(token,want)}
 const key=S.run.id+'\n'+id;let detail=want&&S.detail&&S.detailKey===key?S.detail:null;
 if(!detail){try{detail=await api('/api/case?run='+encodeURIComponent(S.run.id)+'&id='+encodeURIComponent(id))}catch(err){if(token!==S.token)return;S.loading=0;throw err}}
 if(token!==S.token)return;
 S.case=S.run.cases.find(c=>c.id===id);S.detail=detail;S.detailKey=key;$('caseSel').value=id;S.cmp=null;S.ra=S.rb=null;S.cPl={};S.cSeed={};S.on={};S.case.planners.forEach(p=>S.on[p]=true);
 S.seed=S.case.seeds[0];$('seedSel').innerHTML=S.case.seeds.map(s=>`<option value="${esc(s)}">seed ${esc(s)}</option>`).join('');
 S.sel=(eps().find(e=>group(e.failure_class)!=='ok')||eps()[0]||{}).planner??S.case.planners[0];
 const first=eps().find(e=>e.planner===S.sel&&group(e.failure_class)!=='ok');if(first)S.seed=first.simulation_seed;
 if(want)applyCaseWant(want);$('seedSel').value=String(S.seed);
 const ends=Object.values(detail.traces).filter(t=>t.valid).map(t=>t.t[t.t.length-1]);S.tMax=Math.max(1,...ends);S.t=S.tMax;
 if(want&&S.pendingT&&!(S.view==='cmp'&&S.panel==='replay')){const v=S.pendingT.t;S.pendingT=null;
  if(S.view==='explore'){if(v>S.tMax+.005)want.warn.push(`시각 t ${v} s가 이 지도의 시간축(0–${S.tMax.toFixed(2)} s)을 넘어 끝으로 맞췄습니다`);S.t=Math.min(v,S.tMax)}
  else want.warn.push(`시각 t ${v} s: ${S.panel==='delta'?'Paired Δ':'산점도'} 화면에는 시각이 없어 무시했습니다`)}
 $('scr').max=S.tMax;$('axis').innerHTML=[0,1/3,2/3,1].map(f=>`<span>${(f*S.tMax).toFixed(1)}${f===1?' s':''}</span>`).join('');
 S.loading=0;if($('covCsv'))$('covCsv').disabled=false;buildStatic();renderAll()}
$('caseSel').onchange=e=>{openCase(e.target.value).catch(err=>{if(S.case)$('caseSel').value=S.case.id;renderCoverage();renderTable();showMsg('이 지도를 열 수 없습니다.\n'+err.message)})};
$('seedSel').onchange=e=>{S.seed=+e.target.value;renderAll()};
$('filter').onchange=e=>{S.filter=e.target.value;renderTable();writeUrl()};

function renderCoverage(){const c=S.run?S.run.coverage:[];const exp=c.every(x=>x.expected!==null&&x.expected!==undefined)?c.reduce((a,x)=>a+x.expected,0):null,inc=c.reduce((a,x)=>a+(x.included||0),0);
 const bad=c.filter(x=>x.status!=='complete'),el=$('cov');el.classList.toggle('warn',bad.length>0||(exp!==null&&inc<exp));
 el.innerHTML=c.length?`coverage <b>${inc}/${exp??'?'}</b>${bad.length?` · 미완료 case <b>${bad.length}</b>`:''}<button class="csvb" id="covCsv" title="현재 실행의 coverage CSV — 미완료 case 포함 모든 case" aria-label="현재 실행의 coverage CSV 내려받기 — 모든 case">CSV ↓</button>`:'';
 el.title=bad.map(x=>`${x.case_id}: ${x.status}${x.error?' — '+x.error:''}`).join('\n');
 if(bad.length)showMsg('완료되지 않은 case는 집계에서 뺐습니다.\n'+bad.map(x=>`${x.case_id}: ${x.status}${x.error?' — '+x.error:''}`).join('\n'))}

/* CSV 내보내기: 서버가 저장 파일에서 만든다(에피소드는 저장 헤더·값·순서 그대로, coverage는 미완료 case 포함).
   fetch로 받아 오류를 화면에 보이고, 수식으로 해석될 수 있는 값이 있으면 저장 전에 확인받는다. 주소·history는 바꾸지 않는다 */
const FILTER_LABEL={all:'전체',fail:'실패만',ok:'도달만'};
async function download(path){try{const r=await fetch(path);
  if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(b.error||('HTTP '+r.status))}
  if(r.headers.get('X-RacePlan-CSV-Formula-Risk')==='1'&&!confirm('이 CSV에는 스프레드시트가 수식으로 실행할 수 있는 값(=, +, -, @로 시작)이 있습니다.\n값은 저장 원본 그대로 둡니다. Excel에서는 바로 열지 말고 "텍스트/CSV 가져오기"로 여세요.\n\n저장할까요?'))return;
  const m=/filename\*=UTF-8''([^;]+)/.exec(r.headers.get('Content-Disposition')||''),a=document.createElement('a');
  a.href=URL.createObjectURL(await r.blob());a.download=m?decodeURIComponent(m[1]):'raceplan.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
 catch(err){showMsg('CSV를 내보내지 못했습니다.\n'+err.message)}}
$('epCsv').onclick=()=>{if(S.run&&S.case&&!S.loading)download('/api/export/episodes.csv?'+new URLSearchParams({run:S.run.id,case:S.case.id,filter:S.filter}))};
$('cov').onclick=e=>{if(e.target.closest('#covCsv')&&S.run&&!S.loading)download('/api/export/coverage.csv?'+new URLSearchParams({run:S.run.id}))};

function renderGrid(){$('grid').innerHTML=planners().map(p=>`<div class="slot ${S.on[p]?'':'off'} ${S.sel===p?'sel':''}" data-p="${esc(p)}"><div class="num" style="background-color:${color(p)}">${badge(p)}</div><div><b>${esc(p)}</b><small>${S.on[p]?'트랙 표시 중':'트랙에서 숨김'}</small></div></div>`).join('')}
$('grid').onclick=e=>{const s=e.target.closest('.slot');if(s){S.sel=s.dataset.p;if(S.view==='cmp'&&S.panel==='replay'&&S.sel!==S.ra)S.rb=S.sel;renderAll()}};  // 재생 중 고른 planner는 B가 된다

/* 리더보드: 현재 지도의 전체 seed */
function renderLeaderboard(){if(!S.case){$('lb').innerHTML='';$('lbNote').textContent='';return}
 const rows=planners().map(p=>{const a=eps().filter(e=>e.planner===p),ok=a.filter(e=>e.failure_class==='reached'),c={ok:0,col:0,to:0,pe:0};a.forEach(e=>c[group(e.failure_class)]++);
  return{p,a,c,rate:a.length?ok.length/a.length:0,rmse:median(ok.map(e=>e.tracking_rmse_m)),ms:median(a.map(e=>e.runner_planning_time_ms??e.planning_time_ms))}}).sort((x,y)=>y.rate-x.rate||(x.rmse??1e9)-(y.rmse??1e9));
 $('lbNote').textContent='도달률 → RMSE 중앙값 · seed '+S.case.seeds.length+'개';
 $('lb').innerHTML='<div class="lb"><span></span><span class="hd">#</span><span class="hd">결과 구성</span><span class="hd r">RMSE m</span><span class="hd r">계획 ms</span>'+rows.map(r=>{const n=r.a.length||1;
  return `<div class="row" data-p="${esc(r.p)}"><input type="checkbox" data-p="${esc(r.p)}" ${S.on[r.p]?'checked':''} title="트랙에 표시" aria-label="${esc(r.p)} 트랙에 표시"><div class="num" style="background-color:${color(r.p)}">${badge(r.p)}</div><div style="min-width:0"><b>${esc(r.p)}</b> <small>${r.c.ok}/${r.a.length} 도달</small><div class="bar">${[['ok','teal'],['col','red'],['to','amb'],['pe','vio']].map(([k,v])=>`<i style="width:${r.c[k]/n*100}%;background:var(--${v})"></i>`).join('')}</div></div><span class="r" style="font-weight:700">${r.rmse===null?'n/a':r.rmse.toFixed(3)}</span><span class="r">${fmt(r.ms,2)}</span></div>`}).join('')+'</div>'}
$('lb').onchange=e=>{if(e.target.type==='checkbox'){S.on[e.target.dataset.p]=e.target.checked;buildStatic();renderAll()}};

/* 에피소드 표 */
const COLS=[['planner','planner',0],['simulation_seed','seed',0],['failure_class','결과',0],['tracking_rmse_m','RMSE m',1],['completion_time_s','시간 s',1],['driving_min_sampled_clearance_m','clear m',1]];
function renderTable(){const eb=$('epCsv');eb.disabled=!S.case;eb.title=S.case?`에피소드 CSV — ${FILTER_LABEL[S.filter]}, 일치하는 모든 행 (저장 순서·저장 값 그대로, 화면 정렬과 무관)`:'완료된 case가 없습니다';eb.setAttribute('aria-label',eb.title);
 if(!S.case){$('tnote').innerHTML='';$('table').innerHTML=S.run?`<div class="empty">표시할 완료 case가 없습니다</div>`:'';return}
 const {key,dir}=S.sort;let rows=eps().filter(e=>S.filter==='all'||(S.filter==='ok')===(e.failure_class==='reached'));
 rows=[...rows].sort((a,b)=>{const x=a[key],y=b[key];if(x===null||x===undefined)return 1;if(y===null||y===undefined)return -1;if(x<y)return -dir;if(x>y)return dir;return a.simulation_seed-b.simulation_seed});
 /* 선택이 표 필터에 가려지면 숨긴 행을 끼워 넣지 않고(CSV 범위와 같게) 알린다 */
 const hidden=!!ep(S.sel,S.seed)&&!rows.some(e=>e.planner===S.sel&&e.simulation_seed===S.seed);
 $('tnote').innerHTML=`<span>표시 <b>${rows.length}</b> / 전체 ${eps().length}행</span>`+(hidden?`<span class="hid" title="${esc(`선택 ${S.sel} / seed ${S.seed} — '${FILTER_LABEL[S.filter]}' 필터로 숨김`)}">· 선택 행 숨김('${FILTER_LABEL[S.filter]}')</span><button class="lnk" id="showAll">전체 보기로 전환</button>`:'');
 const top=$('table').scrollTop;
 $('table').innerHTML=`<table><thead><tr>${COLS.map(([k,l,n])=>`<th class="${n?'n':''}" data-k="${k}">${l}${k===key?(dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(e=>{const g=group(e.failure_class);
  return `<tr class="${e.planner===S.sel&&e.simulation_seed===S.seed?'sel':''}" data-p="${esc(e.planner)}" data-s="${e.simulation_seed}"><td class="pl" title="${esc(e.planner)}"><span class="dot" style="background:${color(e.planner)}"></span>${esc(e.planner)}</td><td>${e.simulation_seed}</td><td><span class="tag ${OUT[g][0]}">${esc(outLabel(e.failure_class))}</span></td><td class="n">${fmt(e.tracking_rmse_m)}</td><td class="n">${fmt(e.completion_time_s,2)}</td><td class="n">${fmt(e.driving_min_sampled_clearance_m)}</td></tr>`}).join('')}</tbody></table>`;$('table').scrollTop=top;
 /* 선택·필터가 바뀌었을 때만(표가 보일 때) 선택 행을 고정 헤더 아래로 보이게 한다. 일반 재렌더는 스크롤을 건드리지 않는다 */
 const sk=`${S.run.id}|${S.case.id}|${S.sel}|${S.seed}|${S.filter}`,tw=$('table'),row=tw.querySelector('tbody tr.sel');
 if(S.view==='explore'&&sk!==S.tableKey){S.tableKey=sk;if(row){const head=tw.querySelector('thead').getBoundingClientRect().height,rr=row.getBoundingClientRect(),y=rr.top-tw.getBoundingClientRect().top+tw.scrollTop;
  if(y-head<tw.scrollTop)tw.scrollTop=y-head;else if(y+rr.height>tw.scrollTop+tw.clientHeight)tw.scrollTop=y+rr.height-tw.clientHeight}}}
$('tnote').onclick=e=>{if(e.target.id==='showAll'){S.filter='all';$('filter').value='all';renderTable();writeUrl();$('filter').focus()}};
$('table').onclick=e=>{const th=e.target.closest('th');if(th){const k=th.dataset.k;S.sort=S.sort.key===k?{key:k,dir:-S.sort.dir}:{key:k,dir:1};renderTable();writeUrl();return}
 const tr=e.target.closest('tbody tr');if(tr){S.sel=tr.dataset.p;S.seed=+tr.dataset.s;$('seedSel').value=String(S.seed);renderAll()}};

/* 트랙 */
const W=()=>S.detail.grid.width*S.detail.grid.resolution,H=()=>S.detail.grid.height*S.detail.grid.resolution;
const PX=x=>+(x-S.detail.grid.origin_x).toFixed(4),PY=y=>+(H()-(y-S.detail.grid.origin_y)).toFixed(4);
function mapLayers(paths){const g=S.detail.grid,m=Math.max(W(),H())/60;
 const r=g.resolution;let d='';for(const [row,col,len] of g.occupied)d+=`M${(col*r).toFixed(3)} ${((g.height-1-row)*r).toFixed(3)}h${(len*r).toFixed(3)}v${r}h${(-len*r).toFixed(3)}z`;
 let s=`<rect width="${W()}" height="${H()}" fill="none" stroke="#c5cad4" stroke-width="1" vector-effect="non-scaling-stroke"/><path d="${d}" fill="#c3c8d3"/>${paths}`;
 const st=S.detail.start,go=S.detail.goal,tol=S.detail.goal_tolerance;
 if(tol)s+=`<circle cx="${PX(go.x)}" cy="${PY(go.y)}" r="${tol}" fill="rgba(31,163,74,.1)" stroke="#1fa34a" stroke-dasharray="4 3" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
 s+=`<circle cx="${PX(st.x)}" cy="${PY(st.y)}" r="${m*.7}" fill="none" stroke="#1c1c1e" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="${PX(st.x)+m}" y="${PY(st.y)+m*.5}" font-size="${m*1.4}" font-weight="700" fill="#1c1c1e">START</text>`;
 return s+`<text x="${PX(go.x)}" y="${PY(go.y)-(tol||m)-m*.5}" font-size="${m*1.4}" font-weight="700" fill="#1c1c1e" text-anchor="middle">GOAL</text>`}
const planLine=(id,c)=>S.detail.paths[id]?`<polyline points="${S.detail.paths[id].map(q=>PX(q[0])+','+PY(q[1])).join(' ')}" fill="none" stroke="${c}" stroke-opacity=".55" stroke-dasharray="5 4" stroke-width="1.3" vector-effect="non-scaling-stroke"/>`:'';
function buildStatic(){$('track').setAttribute('viewBox',`0 0 ${W()} ${H()}`);let paths='';
 planners().forEach(p=>{if(!S.on[p])return;const e=eps().find(x=>x.planner===p&&S.detail.paths[x.plan_id]);if(e)paths+=planLine(e.plan_id,color(p))});
 $('trStatic').innerHTML=mapLayers(paths)}
function indexAt(ts,t){let lo=0,hi=ts.length-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(ts[mid]<=t)lo=mid;else hi=mid-1}return lo}
/* 실제 궤적(0..n 표본)과 차량 표시; crash면 마지막 위치에 충돌 링 */
function vehicle(p,tr,n,sel,crash){const m=Math.max(W(),H())/60,pts=[];for(let i=0;i<=n;i++)pts.push(PX(tr.x[i])+','+PY(tr.y[i]));const cx=PX(tr.x[n]),cy=PY(tr.y[n]),c=color(p);
 return `<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="${sel?4:2.5}" stroke-linecap="round" stroke-linejoin="round" opacity="${sel?1:.75}" vector-effect="non-scaling-stroke"/>`+
  `<g transform="translate(${cx},${cy})"><rect x="${-m}" y="${-m*.8}" width="${m*2}" height="${m*1.6}" rx="${m*.4}" fill="${c}" stroke="#fff" stroke-width="1.5" vector-effect="non-scaling-stroke"/><text y="${m*.42}" text-anchor="middle" font-size="${m*1.15}" font-weight="700" fill="#fff">${badge(p)}</text></g>`+
  (crash?`<circle cx="${cx}" cy="${cy}" r="${m*1.7}" fill="none" stroke="#ff3b30" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`:'')}
function drawDyn(){if(!S.detail){$('trDyn').innerHTML='';return}let s='';
 planners().forEach(p=>{if(!S.on[p])return;const e=ep(p,S.seed),tr=trace(e);if(!tr||!tr.t.length)return;const n=indexAt(tr.t,S.t);
  s+=vehicle(p,tr,n,S.sel===p,n===tr.t.length-1&&group(e.failure_class)==='col')});
 $('trDyn').innerHTML=s;$('trk').textContent=`${S.t.toFixed(1)} s · seed ${S.seed}`}

/* 타임라인 */
function renderLanes(){if(!S.case){$('lanes').innerHTML='<div class="empty"></div>';return}
 $('lanes').innerHTML=planners().filter(p=>S.on[p]).map(p=>{const e=ep(p,S.seed);if(!e)return'';const g=group(e.failure_class),tr=trace(e),o=OUT[g],has=tr&&tr.t.length,end=has?tr.t[tr.t.length-1]:0;
  return `<div class="lane"><div class="lab" data-p="${esc(p)}"><div class="num" style="background-color:${color(p)}">${badge(p)}</div><b>${esc(p)}</b></div><div class="rl" data-end="${end}">${has?`<div class="fillb" style="background-color:${color(p)}"></div><div class="ev" style="left:${end/S.tMax*100}%;color:${o[2]};border-color:${o[2]}" title="${esc(outLabel(e.failure_class))} ${end.toFixed(2)} s">${o[1]}</div>`:`<div class="ev" style="left:1.2em;color:${o[2]};border-color:${o[2]}">${o[1]}</div><span class="nodrive-l" style="left:2.4em">${badTrace(e)?'궤적 데이터 오류':esc(outLabel(e.failure_class))+' — 주행 없음'}</span>`}</div></div>`}).join('');tick()}
$('lanes').onclick=e=>{const l=e.target.closest('.lab');if(l){S.sel=l.dataset.p;renderAll()}};
function tick(){if(replayOn()){drawReplayDyn();sparkCursor();return}
 $('scr').value=S.t;$('scrub').style.left=S.t/S.tMax*100+'%';$('scrub').dataset.t=S.t.toFixed(1)+' s';
 document.querySelectorAll('#lanes .rl').forEach(r=>{const f=r.querySelector('.fillb');if(f)f.style.width=Math.min(S.t,+r.dataset.end)/S.tMax*100+'%'});drawDyn();sparkCursor()}

let raf=null,last=0;
function playText(){const t=S.playing?'❚❚ 정지':'▶ 재생';$('play').textContent=t;if($('rPlay'))$('rPlay').textContent=t}
function stop(){const was=S.playing;S.playing=false;if(raf)cancelAnimationFrame(raf);raf=null;playText();if(was)writeUrlSoon()}
/* 탐색은 case 전체 길이, 나란히 재생은 두 기록 중 늦은 마지막 표본까지를 같은 시계로 돈다 */
function frame(now){const dt=(now-last)/1000*(replayOn()?S.rspeed:1),max=clockMax();last=now;S.t=Math.min(max,S.t+dt);tick();if(S.t>=max){stop();return}raf=requestAnimationFrame(frame)}
function togglePlay(){if(S.playing){stop();return}if(S.view==='cmp'&&!replayOn())return;const max=clockMax();if(replayOn()?!(max>0):!S.detail)return;if(S.t>=max)S.t=0;S.playing=true;playText();last=performance.now();raf=requestAnimationFrame(frame)}
$('play').onclick=togglePlay;

/* Inspector */
const SERIES=[['추적오차','error','m',2,false],['Clearance','clearance','m',3,false],['속도','speed','m/s',2,false],['조향','steering','rad',2,true]];
function spark(tr,[,key,,,sym],c){const v=tr[key];const vals=v.filter(x=>x!==null);let lo=Math.min(0,...vals),hi=Math.max(...vals,1e-6);if(sym){hi=Math.max(Math.abs(lo),Math.abs(hi));lo=-hi}
 const Y=a=>30-(a-lo)/(hi-lo||1)*28-1,X=t=>t/S.tMax*150,base=Y(Math.max(lo,0));const step=Math.max(1,Math.floor(v.length/300));let pts=[];for(let i=0;i<v.length;i+=step)if(v[i]!==null)pts.push(X(tr.t[i]).toFixed(2)+','+Y(v[i]).toFixed(2));
 const l=v.length-1;if(v[l]!==null)pts.push(X(tr.t[l]).toFixed(2)+','+Y(v[l]).toFixed(2));
 return `<svg viewBox="0 0 150 30" preserveAspectRatio="none" role="img">${lo<0?`<line x1="0" x2="150" y1="${base}" y2="${base}" stroke="#a3a8b4" stroke-width="1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>`:''}<polygon points="${X(tr.t[0]).toFixed(2)},${base} ${pts.join(' ')} ${X(tr.t[l]).toFixed(2)},${base}" fill="${c}" opacity=".14"/><polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="1.5" vector-effect="non-scaling-stroke"/><line class="cur" y1="0" y2="30" stroke="#007aff" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`}
/* 첫 표본 전에는 값 없음, 마지막 표본 뒤에는 마지막 값임을 밝힌다 */
function sparkCursor(){const box=$('sparks');if(!box)return;const tr=trace(ep(S.sel,S.seed));if(!tr)return;const n=indexAt(tr.t,S.t),px=S.t/S.tMax*150,before=S.t<tr.t[0],after=S.t>tr.t[tr.t.length-1];
 box.querySelectorAll('.spk').forEach(d=>{const l=d.querySelector('.cur');l.setAttribute('x1',px);l.setAttribute('x2',px);const s=SERIES[+d.dataset.i],a=tr[s[1]][n];d.querySelector('b').textContent=before||a===null?'—':a.toFixed(s[3])+' '+s[2]+(after?' (마지막)':'')})}
function deltaCell(v,better,digits){if(v===null||v===undefined)return '<span class="d">—</span>';const r=+v.toFixed(digits),good=better==='low'?r<0:r>0,bad=better==='low'?r>0:r<0;
 return `<span class="d ${good?'up':bad?'dn':''}">${r>0?'+':r<0?'−':''}${Math.abs(r).toFixed(digits)}</span>`}
function renderInspector(){if(!S.case){$('insp').innerHTML='';return}const e=ep(S.sel,S.seed);if(!e){$('insp').innerHTML='<div class="empty">이 조합의 에피소드가 없습니다</div>';return}
 const g=group(e.failure_class),o=OUT[g],tr=trace(e),base=S.case.baseline,pair=S.case.pairs.find(x=>x.planner===S.sel&&x.simulation_seed===S.seed),isBase=S.sel===base;
 const row=(k,v,d)=>`<span class="k">${k}</span><span class="v">${v}</span>${d}`,dash='<span class="d">—</span>',cell=(f,b,n)=>pair?deltaCell(pair[f],b,n):dash;
 let fail='';const hasTr=tr&&tr.t.length;
 if(g==='col'&&hasTr){const n=tr.t.length-1;fail=`<div class="fail col"><b>✕ ${esc(outLabel(e.failure_class))} · ${tr.t[n].toFixed(2)} s</b>마지막 위치 (${fmt(tr.x[n],2)}, ${fmt(tr.y[n],2)}) m · 최소 clearance ${fmt(e.driving_min_sampled_clearance_m)} m</div>`}
 if(g==='to'&&hasTr){const n=tr.t.length-1;fail=`<div class="fail to"><b>⏱ 시간 초과 · ${tr.t[n].toFixed(2)} s</b>마지막 위치 (${fmt(tr.x[n],2)}, ${fmt(tr.y[n],2)}) m · 목표까지 ${fmt(e.goal_distance_m,2)} m</div>`}
 if(g==='pe')fail=`<div class="fail pe"><b>! ${esc(outLabel(e.failure_class))}${e.planning_error_type?' · '+esc(e.planning_error_type):''}</b>${esc(e.planning_error_message||e.planning_status)}</div>`;
 const body=hasTr?`<div class="sparks" id="sparks">${SERIES.filter(s=>tr[s[1]]).map(s=>`<div class="spk" data-i="${SERIES.indexOf(s)}"><div class="sph"><span>${s[0]}</span><b></b></div>${spark(tr,s,color(S.sel))}</div>`).join('')}</div>`:`<div class="nodrive">${badTrace(e)?'궤적 데이터 오류로 시계열을 표시하지 않습니다':'주행이 없어 시계열이 없습니다'}</div>`;
 const cmd=S.case.reproduce?S.case.reproduce.map(a=>/\s/.test(a)?`"${a}"`:a).join(' '):null;
 $('insp').innerHTML=`<div style="display:flex;align-items:center;gap:.6em;flex:none"><div class="num" style="background-color:${color(S.sel)}">${badge(S.sel)}</div><div style="min-width:0;flex:1"><b style="font-size:1.1em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(S.sel)}</b><small style="color:var(--mut)">${esc(S.case.map)} · seed ${e.simulation_seed}</small></div><span class="tag ${o[0]}">${o[1]} ${esc(outLabel(e.failure_class))}</span></div>
 <div class="mt"><span></span><span class="h">값</span><span class="h">${isBase?'기준':esc(base?base+' 대비':'')}</span>
 ${row('RMSE',fmt(e.tracking_rmse_m)+' m',cell('delta_tracking_rmse_m','low',3))}${row('완료시간',fmt(e.completion_time_s,2)+' s',cell('delta_completion_time_s','low',2))}${row('최소 clearance',fmt(e.driving_min_sampled_clearance_m)+' m',cell('delta_driving_min_sampled_clearance_m','high',3))}${row('계획시간',fmt(e.runner_planning_time_ms??e.planning_time_ms,2)+' ms',dash)}</div>
 ${fail}<div class="il"><span>시계열</span><span>타임라인과 연동</span></div>${body}
 <div class="il"><span>Provenance</span><span style="color:var(--teal)">✔ 저장 입력 검증 통과</span></div>${cmd?`<div class="cmd" title="새 출력 폴더로 다시 실행하는 명령">${esc(cmd)}</div>`:''}`;sparkCursor()}

/* 비교 분석: 집계(분모·제외 사유)는 서버가 저장 결과에서 계산한다 */
Object.assign(S,{view:'explore',panel:'delta',metric:'rmse',xsrc:'reported',cOut:'all',cPl:{},cSeed:{},cmp:null,ctoken:0,ra:null,rb:null,rspeed:1});

function viewDom(){$('app').classList.toggle('cmp',S.view==='cmp');document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view))}

 if(v==='cmp'&&S.panel==='replay'&&S.ra!==null&&S.sel&&S.sel!==S.ra&&S.sel!==S.rb)S.rb=S.sel;  // 탐색에서 고른 planner가 재생 B가 된다

 let q=[...keys('planners',pl),...keys('seeds',sd)];
 if(S.cOut==='reached')q=q.concat(keys('outcomes',['reached']));else if(S.cOut==='fail')q=q.concat(keys('outcomes',[...new Set(eps().map(e=>e.failure_class).filter(c=>c!=='reached'))]));

function renderCmpCtl(){const opt=(v,l,cur)=>`<option value="${v}" ${v===cur?'selected':''}>${l}</option>`;
 const tabs=`<div class="tabs" id="panelTabs">${[['delta','Paired Δ'],['scatter','산점도'],['replay','나란히 재생']].map(([v,l])=>`<button data-v="${v}" class="${S.panel===v?'on':''}">${l}</button>`).join('')}</div>`;

/* URL 상태: 새로고침·링크 공유·뒤로/앞으로. 목록은 비교 API처럼 키 반복(키 없음 = 전체, 빈 값 = 선택 없음).
   시각 t만 바뀌면 replaceState, 나머지 변경은 pushState. 복원 중에는 쓰지 않고, 링크 값이 맞지 않으면 기본값으로 대체하며 S.lw로 알린다 */

function urlState(){const q=new URLSearchParams();if(!S.run)return q;q.set('run',S.run.id);
 const list=(k,chosen,all)=>{if(chosen.length===all.length)return;if(!chosen.length)q.append(k,'');else chosen.forEach(v=>q.append(k,v))};
 if(S.case){q.set('case',S.case.id);q.set('seed',S.seed);if(S.sel!=null)q.set('planner',S.sel)}
 if(S.view!=='explore')q.set('view',S.view);if(S.panel!=='delta')q.set('panel',S.panel);if(S.filter!=='all')q.set('filter',S.filter);
 if(S.sort.key!=='planner')q.set('sort',S.sort.key);if(S.sort.dir<0)q.set('dir','desc');
 if(S.metric!=='rmse')q.set('metric',S.metric);if(S.xsrc!=='reported')q.set('x',S.xsrc);if(S.cOut!=='all')q.set('out',S.cOut);
 if(S.case){const ps=planners(),sd=S.case.seeds;list('track',ps.filter(p=>S.on[p]),ps);list('planners',ps.filter(p=>S.cPl[p]!==false),ps);list('seeds',sd.filter(s=>S.cSeed[s]!==false),sd);
  if(S.ra)q.set('a',S.ra);if(S.rb)q.set('b',S.rb)}
 if(S.rspeed!==1)q.set('speed',S.rspeed);
 const rt=S.pendingT?S.pendingT.t:S.t;  // 재생 응답 전이면 링크 시각을 그대로 유지
 if(S.case&&(S.view==='cmp'&&S.panel==='replay'?rt>0:S.view==='explore'&&Math.abs(S.t-S.tMax)>1e-6))q.set('t',+rt.toFixed(2));

let tTimer=null;

 const q=urlState().toString();if(q===S.urlBase)return;const bare=p=>{const c=new URLSearchParams(p);c.delete('t');return c.toString()};

/* 사용자 입력은 진행 중인 복원의 쓰기 잠금을 풀고(주소와 화면이 어긋나지 않게), 대기 중인 시각을 먼저 지금 항목에 확정한다 */
for(const ev of ['click','change','input'])document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('.csvb,a[download]'))return;  // 내려받기는 화면 상태가 아니다

function linkWarn(m){if(S.restoring&&S.rwarn)S.rwarn.push(m);else{S.lw.push(m);renderLinkWarn()}}
function one(q,warn,k,ok,label,fb='기본값을 씁니다'){const v=q.getAll(k);if(!v.length)return undefined;
 if(v.length>1){warn.push(`${label}: 값이 ${v.length}개라 ${fb}`);return undefined}
 if(!ok(v[0])){warn.push(`${label} '${v[0]}'은(는) 올바르지 않거나 없어 ${fb}`);return undefined}return v[0]}
function many(q,warn,k,ok,label){if(!q.has(k))return null;const raw=[...new Set(q.getAll(k).filter(v=>v!==''))],good=raw.filter(ok),bad=raw.filter(v=>!ok(v));
 if(bad.length)warn.push(`${label} ${bad.map(v=>`'${v}'`).join(', ')}을(를) 찾을 수 없어 제외했습니다${good.length?'':' · 선택된 항목이 없습니다'}`);return good}
function applyCaseWant({q,warn}){const ps=planners(),sd=S.case.seeds,isP=v=>ps.includes(v),isSeed=v=>/^-?\d+$/.test(v)&&sd.includes(+v);

 const a=one(q,warn,'a',isP,'재생 A');if(a!==undefined)S.ra=a;const effA=S.ra??(ps.includes(S.case.baseline)?S.case.baseline:ps[0]);

/* 새 비교 실행: 서버가 raceplan-workflow를 별도 프로세스로 돌린다(시간 제한·취소). 쓰기 요청은 세션 토큰을 붙인

/* 세션 토큰: raceplan-gui가 열거나 출력한 주소의 #token=…(서버로 전송되지 않는 조각)에서만 받는다. 이 출처의 localStorage에 두고
   주소에서 지워 링크·기록에 남기지 않는다. 페이지 본문·API 응답에는 토큰이 없어, 페이지만 받아 가는 다른 프로그램은 실행을 시작할 수 없다 */
const TOKEN=(()=>{const m=/(?:^|&)token=([A-Za-z0-9_-]+)/.exec(location.hash.slice(1));
 if(m){try{localStorage.setItem('raceplan-token',m[1])}catch(err){}history.replaceState(null,'',location.pathname+location.search)}
 try{return localStorage.getItem('raceplan-token')||(m?m[1]:'')}catch(err){return m?m[1]:''}})();

const tokenHint=msg=>/session token/.test(msg)?'이 탭의 실행 권한이 이 서버와 맞지 않습니다(서버가 다시 시작되었을 수 있음). raceplan-gui가 출력한 주소로 다시 여세요.':msg;
const JOB_LABEL={running:'실행 중',complete:'완료',failed:'실패',timeout:'시간 초과로 중지',cancelled:'취소됨'};
const PHASE_LABEL={experiment:'계획·주행',analysis:'분석',report:'그림'},PHASE_STATE={pending:'대기',running:'진행 중',complete:'완료',failed:'실패'};
Object.assign(S,{ro:null,job:null,jobTimer:null,dlgFrom:null,jobShown:null,watch:null,watchTimer:null,watchShown:null,watchGen:0,runsVersion:null,listGen:0,fresh:new Set(),finished:new Set()});
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-RacePlan-Token':TOKEN},body:JSON.stringify(body)});
 const b=await r.json().catch(()=>({error:'응답을 읽지 못했습니다'}));if(!r.ok)throw new Error(b.error||('HTTP '+r.status));return b}
async function loadRunOptions(){try{S.ro=await api('/api/run-options')}catch(err){S.ro={enabled:false,reason:err.message}}
 const b=$('newRun');b.hidden=false;b.disabled=!S.ro.enabled||!TOKEN;b.title=!S.ro.enabled?'실행 기능 꺼짐: '+(S.ro.reason||''):!TOKEN?NO_TOKEN:'새 비교를 별도 프로세스로 실행합니다';
 S.watch=S.ro.watch||null;if(S.ro.current_job){S.job=S.ro.current_job;if(S.job.status==='running')pollJob()}if(S.watch&&S.watch.active)pollWatch();renderJobPill()}
function renderJobPill(){const j=S.job,p=$('jobPill');p.hidden=!j;if(!j)return;const ph=j.workflow&&j.workflow.current_phase;
 p.className='jp'+(j.status==='complete'?' ok':j.status==='running'?'':' bad');
 const w=S.watch&&S.watch.active?`watch ${S.watch.runs}회 · `:'';
 p.textContent=w+(j.status==='running'?`실행 중 · ${PHASE_LABEL[ph]||'준비'} · ${Math.round(j.elapsed_s)} s`:`실행 ${JOB_LABEL[j.status]||j.status}`)}
function openDialog(mode){if(!$('dlgbg').hidden&&$('dlg').dataset.mode===mode)return;S.dlgFrom=S.dlgFrom||document.activeElement;$('dlgbg').hidden=false;if(mode==='form')renderForm();else{S.jobShown=null;renderJob(true)}}
function closeDialog(){$('dlgbg').hidden=true;$('dlg').innerHTML='';$('dlg').dataset.mode='';S.jobShown=null;const f=S.dlgFrom;S.dlgFrom=null;if(f&&f.isConnected&&f.focus)f.focus()}
$('newRun').onclick=()=>openDialog(S.job&&S.job.status==='running'?'job':'form');
$('jobPill').onclick=()=>openDialog('job');
$('dlgbg').onclick=e=>{if(e.target===$('dlgbg'))closeDialog()};
/* 대화상자가 열려 있으면 Esc로 닫고, Tab 포커스는 대화상자 안에서만 돈다(포커스가 body로 빠져도) */
document.addEventListener('keydown',e=>{if($('dlgbg').hidden)return;if(e.key==='Escape'){e.preventDefault();closeDialog();return}if(e.key!=='Tab')return;
 const f=[...$('dlg').querySelectorAll('button,select,input,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;const i=f.indexOf(document.activeElement);
 if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i<0||i===f.length-1)){e.preventDefault();f[0].focus()}});
function renderForm(){const ro=S.ro,sc=ro.scenarios||[],d=$('dlg');d.dataset.mode='form';
 d.innerHTML=`<h3 id="dlgT">새 비교 실행</h3>${sc.length?'':'<div class="err">scenarios 폴더에 실행할 시나리오가 없습니다.</div>'}
 <label class="f">시나리오<select id="rdScn">${sc.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} — ${esc(s.id)}</option>`).join('')}</select></label>
 <div class="f">내장 planner (1개 이상)<div>${ro.planners.map(p=>`<label class="ck"><input type="checkbox" class="rdP" value="${esc(p)}" ${p==='astar'?'checked':''}>${esc(p)}</label>`).join('')}</div></div>
 <label class="f">사용자 플래너 — 한 줄에 하나, <span><code>FILE.py:CLASS</code> (상대 경로는 GUI 서버를 시작한 폴더 기준)</span><textarea id="rdCustom" rows="2" placeholder="examples/my_planner.py:MyPlanner" spellcheck="false"></textarea></label>
 <div class="warnbox" id="rdWarn" hidden><b>사용자 플래너 파일의 파이썬 코드가 이 컴퓨터에서 그대로 실행됩니다.</b><span>GUI 서버와 다른 프로세스에서 시간 제한을 두고 돌지만, 파일·네트워크 접근은 막지 않습니다. 신뢰하는 파일만 실행하세요.</span><label class="ck"><input type="checkbox" id="rdTrust">이 파일들을 신뢰합니다</label>
 <label class="ck"><input type="checkbox" id="rdWatch">파일을 저장할 때마다 자동으로 다시 실행 (watch) — 결과가 저장마다 새 폴더로 쌓이고, 실행 중에 저장하면 그 실행은 취소됩니다</label></div>
 <div class="row"><label class="f">seed (공백·쉼표로 구분)<input type="text" id="rdSeeds" value="${esc(sc[0]?sc[0].simulation_seed:0)}"></label>
 <label class="f">기준 planner<select id="rdBase"><option value="">자동 (astar, 없으면 첫 내장 planner)</option>${ro.planners.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></label></div>
 <div class="err" id="rdErr" role="alert"></div>
 <div class="btns"><span class="sp">별도 프로세스 · 시간 제한 ${esc(ro.timeout_s)} s · 결과는 ${esc(ro.output_folder)}/ 아래 새 폴더</span><button class="btn" id="rdClose">닫기</button><button class="btn pri" id="rdGo" ${sc.length?'':'disabled'}>실행</button></div>`;
 $('rdScn').onchange=()=>{const s=sc.find(x=>x.id===$('rdScn').value);if(s&&!$('rdSeeds').dataset.touched)$('rdSeeds').value=s.simulation_seed};
 $('rdSeeds').oninput=()=>{$('rdSeeds').dataset.touched='1'};
 $('rdCustom').oninput=()=>{$('rdWarn').hidden=!$('rdCustom').value.trim()};
 $('rdClose').onclick=closeDialog;$('rdGo').onclick=startJob;($('rdScn')||$('rdClose')).focus()}
async function startJob(){const err=$('rdErr'),planners=[...document.querySelectorAll('.rdP:checked')].map(c=>c.value),custom=$('rdCustom').value.split('\n').map(s=>s.trim()).filter(Boolean),raw=$('rdSeeds').value.trim(),base=$('rdBase').value;
 const seeds=raw?raw.split(/[\s,]+/).filter(Boolean).map(Number):[];
 if(!planners.length){err.textContent='내장 planner를 하나 이상 고르세요. 분석 기준이 내장 planner여야 합니다.';return}
 if(!seeds.length||seeds.some(s=>!Number.isSafeInteger(s)||s<0)){err.textContent='seed는 0 이상의 정수를 공백이나 쉼표로 구분해 적으세요.';return}
 if(custom.length&&!$('rdTrust').checked){err.textContent='사용자 플래너를 실행하려면 "이 파일들을 신뢰합니다"를 체크하세요.';$('rdTrust').focus();return}
 if(base&&!planners.includes(base)){err.textContent='기준 planner는 고른 내장 planner 중 하나여야 합니다.';return}
 const go=$('rdGo');go.disabled=true;err.textContent='';  // 요청 중 대화상자가 닫혀도 이 요소들만 만진다(분리된 요소는 화면에 영향 없음)
 const body={scenario:$('rdScn').value,planners,custom_planners:custom,seeds,baseline:base||null,...(custom.length?{trust_user_code:true}:{})},watching=custom.length>0&&$('rdWatch').checked;
 try{if(watching){const r=await post('/api/watch',body);S.watchGen++;S.watch=r.watch;S.job=r.job;pollWatch()}else S.job=await post('/api/jobs',body);
  renderJobPill();S.jobShown=null;renderJob(true);pollJob()}
 catch(e){err.textContent='실행을 시작하지 못했습니다: '+tokenHint(e.message);go.disabled=false}}
/* 작업 화면: 틀은 상태가 바뀔 때만 다시 만들고(버튼 포커스 유지), 진행·로그는 제자리에서 바꾼다 */
function renderJob(force){const j=S.job,d=$('dlg');if($('dlgbg').hidden||(!force&&d.dataset.mode!=='job'))return;if(!j){closeDialog();return}
 if(S.jobShown!==j.id+'|'+j.status){S.jobShown=j.id+'|'+j.status;d.dataset.mode='job';const tag=j.status==='complete'?'t-ok':j.status==='running'?'t-drv':'t-col';
  d.innerHTML=`<h3 id="dlgT">비교 실행 <span class="tag ${tag}">${esc(JOB_LABEL[j.status]||j.status)}</span>${j.watch_run?`<small style="color:var(--mut);font-weight:400">watch ${esc(j.watch_run)}번째 · ${j.trigger==='change'?'파일 변경':'시작'}</small>`:''}</h3><div id="jbWatch"></div><div class="meta" id="jbMeta"></div><div class="phases" id="jbPh"></div><div id="jbErr"></div>
  <pre class="joblog" id="jobLog" tabindex="0" aria-label="실행 로그 (마지막 400줄)"></pre>
  <div class="btns"><span class="sp">결과 폴더 ${esc(j.run_id)}</span>${j.status==='running'?'<button class="btn" id="jbCancel">실행 취소</button>':'<button class="btn" id="jbNew">새 실행</button>'}${j.status==='complete'?'<button class="btn pri" id="jbOpen">결과 열기</button>':''}<button class="btn" id="jbClose">닫기</button></div>`;
  if($('jbCancel')){const b=$('jbCancel'),box=$('jbErr');b.onclick=async()=>{b.disabled=true;try{await post(`/api/jobs/${j.id}/cancel`,{});pollJob()}catch(e){box.textContent='취소하지 못했습니다: '+tokenHint(e.message);b.disabled=false}}}  // 최종 상태는 polling이 가져온다
  if($('jbNew'))$('jbNew').onclick=()=>{S.jobShown=null;renderForm()};
  if($('jbOpen'))$('jbOpen').onclick=()=>{closeDialog();openRun(j.run_id)};
  $('jbClose').onclick=closeDialog;($('jbCancel')||$('jbOpen')||$('jbClose')).focus();S.watchShown=null}  // 틀을 새로 만들었으니 watch 줄도 새로
 renderWatchBar();
 const wf=j.workflow,names=custom=>custom.map(c=>c.split(/[\\/]/).pop());
 $('jbMeta').textContent=`${j.scenario} · ${[...j.planners,...names(j.custom_planners)].join(', ')} · seed ${j.seeds.join(' ')} · ${Math.round(j.elapsed_s)} / ${j.timeout_s} s`;
 $('jbPh').innerHTML=['experiment','analysis','report'].map(n=>{const st=(wf&&wf.phases&&wf.phases[n])||'pending';return `<span class="ph ${esc(st)}">${PHASE_LABEL[n]} · ${esc(PHASE_STATE[st]||st)}</span>`}).join('');
 const bad=j.status!=='running'&&j.status!=='complete';
 $('jbErr').innerHTML=(bad?`<div class="warnbox"><b>${esc(JOB_LABEL[j.status]||j.status)}${j.status==='timeout'?` — 시간 제한 ${esc(j.timeout_s)} s를 넘어 프로세스를 멈췄습니다`:j.status==='cancelled'?' — 사용자가 멈췄습니다':` — 종료 코드 ${esc(j.exit_code)}`}</b>${wf&&wf.error?`<span>${esc(wf.failed_phase||'')}: ${esc(wf.error.type||'')} ${esc(wf.error.message||'')}</span>`:''}${j.record?`<span>${esc(j.record)}</span>`:`<span>부분 결과는 <code>${esc(j.run_id)}</code>에 남고 목록에는 실패로 보입니다.</span>`}</div>`:'')+(j.pollError?`<div class="err">상태를 읽지 못했습니다: ${esc(j.pollError)}</div>`:'');
 // 로그는 바뀌었을 때만, 그리고 사용자가 로그를 선택(복사)하는 중이 아닐 때만 바꾼다
 const log=$('jobLog'),text=j.log.length?j.log.join('\n'):'(아직 출력 없음)',sel=getSelection(),selecting=sel&&!sel.isCollapsed&&log.contains(sel.anchorNode);
 if(text!==log.textContent&&!selecting){const atEnd=log.scrollHeight-log.scrollTop-log.clientHeight<4;log.textContent=text;if(atEnd)log.scrollTop=log.scrollHeight}}
function pollJob(){clearTimeout(S.jobTimer);const id=S.job&&S.job.id;if(!id)return;
 S.jobTimer=setTimeout(async()=>{let j;try{j=await api('/api/jobs/'+id)}catch(e){if(S.job&&S.job.id===id){S.job={...S.job,pollError:e.message};renderJobPill();renderJob();pollJob()}return}
  if(!S.job||S.job.id!==id)return;const was=S.job.status;S.job=j;renderJobPill();renderJob();
  if(j.status==='running'){pollJob();return}if(was==='running')jobFinished(j)},700)}
/* 끝난 작업은 작업마다 한 번만 처리한다(작업 폴링과 watch 폴링 어느 쪽이 먼저 보든) */
async function jobFinished(j){if(S.finished.has(j.id))return;S.finished.add(j.id);await refreshRuns(true);
 if(j.status==='complete'&&S.runs.some(r=>r.id===j.run_id)){if(!$('dlgbg').hidden&&!(S.watch&&S.watch.active))closeDialog();await openRun(j.run_id)}}
/* watch: 서버가 파일 변경마다 새 작업을 시작한다. 1.5초마다 상태를 읽어 새 작업이 생기면 그 작업을 따라가고, 끝나면 새 결과를 연다 */
function pollWatch(){clearTimeout(S.watchTimer);if(!S.watch||!S.watch.active)return;
 S.watchTimer=setTimeout(async()=>{const gen=S.watchGen;let ro;try{ro=await api('/api/run-options')}catch(err){pollWatch();return}
  if(gen!==S.watchGen)return;  // watch 끄기·새 watch보다 먼저 보낸 응답은 버린다
  S.watch=ro.watch||null;const cur=ro.current_job;
  if(cur&&(!S.job||cur.id!==S.job.id)){S.job=cur;S.jobShown=null;renderJob();if(cur.status==='running')pollJob();else jobFinished(cur)}  // 폴링 사이에 이미 끝난 작업도 연다
  renderJobPill();renderWatchBar();pollWatch()},1500)}
function renderWatchBar(){const box=$('jbWatch');if(!box)return;const w=S.watch;
 const key=w?JSON.stringify([w.active,w.runs,w.last_change,w.missing,w.blocked,w.error]):'';if(key===S.watchShown)return;S.watchShown=key;  // 버튼 포커스를 지키려고 바뀔 때만 다시 그린다
 if(!w){box.innerHTML='';return}const t=w.last_change?new Date(w.last_change).toLocaleTimeString():'';
 box.innerHTML=`<div class="watchbar ${w.active?'':'off'}"><b>${w.active?'watch 중':'watch 꺼짐'}</b><span>${esc(w.files.map(f=>f.split(/[\\/]/).pop()).join(', '))} · 실행 ${esc(w.runs)}회${t?' · 마지막 변경 '+esc(t):''}${w.blocked?' · 실행 안 함: '+esc(w.blocked):w.missing?' · 파일을 읽을 수 없음(저장 중이거나 삭제됨)':''}${w.error?' · '+esc(w.error):''}</span>${w.active?'<button class="btn" id="jbUnwatch">watch 끄기</button>':''}</div>`}
$('dlg').addEventListener('click',async e=>{if(e.target.id!=='jbUnwatch')return;const b=e.target,box=$('jbErr');b.disabled=true;S.watchGen++;
 try{const r=await post('/api/watch/stop',{});S.watchGen++;S.watch=r.watch;renderJobPill();renderWatchBar()}catch(err){b.disabled=false;if(box)box.textContent='watch를 끄지 못했습니다: '+tokenHint(err.message)}});
/* 목록 갱신은 이 함수 하나로만 한다. 3초마다 서명만 확인해 바뀌면 다시 읽고(force면 바로), 늦게 온 이전 응답은 버린다.
   다른 창의 raceplan-watch나 CLI가 만든 결과도 여기서 "새"로 나타난다 */
async function refreshRuns(force){if(!S.listReady)return;const gen=++S.listGen;let v=null;
 try{v=(await api('/api/runs-version')).version}catch(err){if(!force)return}if(!force&&v===S.runsVersion)return;
 let d;try{d=await api('/api/runs')}catch(err){if(force)showMsg('결과 목록을 다시 읽지 못했습니다.\n'+err.message);return}
 if(gen!==S.listGen)return;
 const before=new Map(S.runs.map(r=>[r.id,r.status])),wasEmpty=!S.runs.length;S.runs=d.runs;if(v)S.runsVersion=v;  // 목록을 읽은 뒤에야 서명을 기억한다
 d.runs.forEach(r=>{if(!before.has(r.id))S.fresh.add(r.id)});renderRuns();if(wasEmpty&&S.runs.length&&!S.run)showMsg('');
 const open=S.run&&d.runs.find(r=>r.id===S.run.id);
 if(open&&before.has(open.id)&&before.get(open.id)!==open.status&&!(S.job&&S.job.run_id===open.id))
  showMsg(`열어 둔 실행 ${open.name}의 상태가 ${open.status}(으)로 바뀌었습니다. 목록에서 다시 누르면 최신 결과를 봅니다.`)}
setInterval(()=>{if(!document.hidden)refreshRuns()},3000);

(async()=>{loadRunOptions();try{S.runsVersion=(await api('/api/runs-version')).version}catch(err){}try{const d=await api('/api/runs');S.runs=d.runs;renderRuns();S.listReady=true;  // 첫 목록 전에는 자동 갱신(새 표시)을 하지 않는다
 if(!S.runs.length){showMsg('저장된 실행을 찾지 못했습니다.\n검색한 폴더: '+d.root+'\n[+ 새 실행]으로 비교를 실행할 수 있습니다(실행 기능이 켜져 있을 때).');return}
 await restore()}catch(err){showMsg('결과 목록을 읽지 못했습니다.\n'+err.message)}})();
</script></body></html>
